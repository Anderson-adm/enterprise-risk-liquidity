# Local source and consumer databases (development stand-ins for the enterprise systems).
#   PostgreSQL : fund_ops, portfolio_risk                       (sources 1 and 2)
#   SQL Server : legacy_finance, exposure_compliance (sources 3 and 4) + consumer_reporting
# Logical databases are created by `erl generate` (erl.sources.seed.ensure_databases).
#
# Usage (requires a running Docker engine):
#   docker compose -f docker/compose.yaml --env-file .env up -d --wait
#   docker compose -f docker/compose.yaml down          # keeps named volumes
#   docker compose -f docker/compose.yaml down -v       # also deletes the data volumes
name: erl

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: erl
      POSTGRES_PASSWORD: ${ERL_PG_PASSWORD:?set ERL_PG_PASSWORD in .env}
      POSTGRES_DB: postgres
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    ports: ["127.0.0.1:5432:5432"]   # loopback only, never exposed to the network
    volumes: ["erl_pgdata:/var/lib/postgresql/data"]
    mem_limit: 384m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erl -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${ERL_MSSQL_SA_PASSWORD:?set ERL_MSSQL_SA_PASSWORD in .env}
      MSSQL_MEMORY_LIMIT_MB: "1536"
    ports: ["127.0.0.1:1433:1433"]
    volumes: ["erl_mssqldata:/var/opt/mssql"]
    mem_limit: 2g          # SQL Server needs at least 2 GB; leaves room in a 7.7 GiB WSL2 VM
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  erl_pgdata:
    name: erl_pgdata
  erl_mssqldata:
    name: erl_mssqldata

[project]
name = "erl-platform"
version = "0.1.0"
description = "Enterprise Risk & Liquidity Data Platform — synthetic, reproducible financial data integration case."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "sqlalchemy>=2.0,<2.2",
    "pyarrow>=17",
    "lxml>=5.3",
    "boto3>=1.35",
    "duckdb>=2.0",
    "psycopg[binary]>=3.2",
    "pymssql>=2.3",
    "dbt-core>=1.10,<1.13",
    "dbt-duckdb>=1.9,<1.12",
    "dbt-athena>=1.9,<1.12",
]

[project.scripts]
erl = "pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "moto[s3]>=5.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

# Local application plus explicit public parser integrations and pinned integrity protocol.
[tool.hatch.build]
dev-mode-dirs = ['apps/hybrid-runner', 'apps/hybrid-runner/python', 'apps/publisher/python', 'apps/source-generator/python', 'protocols/integrity-v2', 'lambda/market-data/python', 'lambda/internal-xml/python', 'lambda/external-xml/python', '.']

[tool.hatch.build.targets.wheel]
only-include = ['apps/hybrid-runner/python/connect', 'apps/hybrid-runner/python/extract', 'apps/hybrid-runner/python/ingestion', 'apps/publisher/python/load', 'apps/hybrid-runner/python/pipeline', 'apps/source-generator/python/sources', 'apps/hybrid-runner/python/utils', 'protocols/integrity-v2/erl_protocol', 'contracts', 'apps/hybrid-runner/sql', 'lambda/market-data/python/market_data', 'lambda/internal-xml/python/internal_xml', 'lambda/external-xml/python/external_xml']

[tool.hatch.build.targets.wheel.sources]
"apps/hybrid-runner/python" = ""
"apps/publisher/python" = ""
"apps/source-generator/python" = ""
"protocols/integrity-v2" = ""
"contracts" = "contracts"
"apps/hybrid-runner/sql" = "sql"
"lambda/market-data/python" = ""
"lambda/internal-xml/python" = ""
"lambda/external-xml/python" = ""

[tool.ruff]
line-length = 110
target-version = "py311"  # Glue 5.0 runs Python 3.11; keep shared code compatible.
src = ["apps/publisher/python", "apps/source-generator/python", "apps/hybrid-runner/python", "protocols/integrity-v2", "lambda", "glue", "tests"]
extend-exclude = ["dbt/target", "dbt/dbt_packages", ".tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "DTZ"]
ignore = [
    "S101",  # assert is fine in tests
    "S608",  # identifiers rendered only from contract allowlists (utils/sql_files.py)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "DTZ"]
"glue/**" = ["DTZ"]
# synthetic source data: deterministic PRNG (not crypto) and naive timestamps as stored by the sources
"apps/source-generator/python/sources/synthetic.py" = ["S311", "DTZ001"]
"apps/source-generator/python/sources/seed.py" = ["DTZ"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires running PostgreSQL/SQL Server containers (see docs/LOCAL_RUNTIME.md)",
    "dbt: runs dbt against a local DuckDB file (slower)",
]

# Pull-request / push CI. No AWS credentials, no deployment, no cloud calls.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (ruff, pytest, dbt on DuckDB)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --frozen
      - name: Ruff
        run: |
          uv run ruff check src tests airflow glue
          uv run ruff format --check src tests airflow glue
      - name: dbt parse (configuration check, no warehouse needed)
        run: uv run dbt parse --project-dir dbt --profiles-dir dbt --target local
      - name: Unit and contract tests
        run: uv run pytest -m "not dbt and not integration"
      - name: End-to-end scenarios (dbt build on DuckDB, SQLite stand-ins for the databases)
        run: uv run pytest -m "dbt and not integration"
      - name: Lambda package builds
        run: scripts/build_lambda.sh

  terraform:
    name: terraform (fmt, validate, tflint, checkov, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.65.0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: fmt
        run: terraform fmt -check -recursive
      - name: init (no backend) + validate + test (mocked provider, plan only)
        run: |
          for dir in modules/secure_bucket bootstrap environments/dev; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$dir" validate
            if [ -d "$dir/tests" ]; then terraform -chdir="$dir" test; fi
            echo "::endgroup::"
          done
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # rate limit for plugin download only
        run: |
          tflint --init --config="$PWD/.tflint.hcl"
          for dir in modules/secure_bucket bootstrap environments/dev; do
            tflint --chdir="$dir" --config="$PWD/.tflint.hcl"
          done
      - name: checkov
        run: uvx --python 3.12 checkov@3.4.0 -d . --framework terraform --compact --quiet
